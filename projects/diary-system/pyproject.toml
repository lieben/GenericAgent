[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diary-system"
version = "0.1.0"
description = "通用生活日记外挂，支持任意Agent调用"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "tomli>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
diary = "cli.diary_cli:main"
